name: docscanner
description: Flutter plugin for scanning documents, optimized for long POS receipts with OCR text extraction.
version: 1.0.0
homepage: https://github.com/spich/docscanner

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.docscanner
        pluginClass: DocscannerPlugin
      ios:
        pluginClass: DocscannerPlugin
